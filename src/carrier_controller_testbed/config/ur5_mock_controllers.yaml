/cambot_testbed/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    bimanual_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    ur5_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/cambot_testbed/ur5_trajectory_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.01

/cambot_testbed/bimanual_trajectory_controller:
  ros__parameters:
    joints: [left_shoulder_joint, left_elbow_joint, right_shoulder_joint, right_elbow_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.01
